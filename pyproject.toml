[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-racing-championship"
version = "1.0.0"
description = "Algorithm-driven 2D racing championship for DAA"
requires-python = ">=3.12"
dependencies = ["pygame-ce==2.5.8", "arcade==3.3.3", "matplotlib==3.11.1"]

[project.optional-dependencies]
dev = ["pytest==8.3.5", "pytest-cov==7.1.0", "ruff==0.14.6", "pyinstaller==6.22.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
