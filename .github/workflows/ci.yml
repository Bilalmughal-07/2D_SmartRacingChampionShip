name: Smart Racing Championship CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: python -m ruff check .
      - name: Compile
        run: python -m compileall -q src tests run_*.py build_report.py
      - name: Unit and integration tests
        run: python -m pytest -q
      - name: Validate circuits
        run: python run_validation.py
      - name: Headless race smoke
        run: python run_game.py --headless --track circuit_01
